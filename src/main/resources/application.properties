spring.application.name=personal-ai

# Ollama Cloud - existing configuration
spring.ai.openai.base-url=https://ollama.com/v1
spring.ai.openai.chat.completions-path=/chat/completions
spring.ai.openai.api-key=${OLLAMA_API_KEY}
spring.ai.openai.chat.options.model=gpt-oss:20b-cloud

# MySQL - XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/personal_ai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila
spring.datasource.username=root
spring.datasource.password=

# Database connection settings
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Resume/CV uploads are processed in memory and are not retained as files.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
