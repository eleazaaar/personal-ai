spring.application.name=personal-ai

spring.config.import=optional:file:.env[.properties]

server.port=${PORT}

spring.ai.openai.base-url=${OLLAMA_API_URL}
spring.ai.openai.api-key=${OLLAMA_API_KEY}
spring.ai.openai.chat.options.model=${OLLAMA_API_MODEL}

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

personal-ai.base-url=${BASE_URL}
personal-ai.environment=${ENVIRONMENT}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
